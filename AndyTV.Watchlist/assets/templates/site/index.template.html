<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <title>AndyTV Watchlist — Best Sports Today</title>

  <link
    rel="icon"
    href="https://raw.githubusercontent.com/aherrick/AndyTV/refs/heads/main/AndyTV/AndyTV.ico"
  />

  <meta
    name="description"
    content="The best sports to watch today, ranked daily by AndyTV."
  />

  <meta name="theme-color" content="#0b0e13" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f4f6fa" media="(prefers-color-scheme: light)" />

  <!-- Set theme before paint to avoid a flash; a saved choice wins, otherwise follow the OS. -->
  <script>
    (function () {
      var saved = localStorage.getItem("andytv-theme");
      var theme = saved || (window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
      document.documentElement.setAttribute("data-theme", theme);
    })();
  </script>

  <meta property="og:type" content="website" />
  <meta property="og:title" content="AndyTV Watchlist — Best Sports Today" />
  <meta property="og:description" content="The best sports to watch today, ranked daily by AndyTV." />
  <meta property="og:url" content="https://andytvwatchlist.z19.web.core.windows.net/" />
  <meta property="og:image" content="https://raw.githubusercontent.com/aherrick/AndyTV/refs/heads/main/AndyTV.Watchlist/assets/img/andytvwatchlist_header.png" />

  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="AndyTV Watchlist — Best Sports Today" />
  <meta name="twitter:description" content="The best sports to watch today, ranked daily by AndyTV." />
  <meta name="twitter:image" content="https://raw.githubusercontent.com/aherrick/AndyTV/refs/heads/main/AndyTV.Watchlist/assets/img/andytvwatchlist_header.png" />

  <style>
    :root {
      --bg: #0b0e13;
      --surface: #161b26;
      --surface-2: #1e2534;
      --border: #2a3242;

      --text: #e8edf4;
      --muted: #9aa7bd;

      --accent: #f5c518;
      --accent-2: #38bdf8;

      --radius: 14px;
      --wrap: 640px;
    }

    :root[data-theme="light"] {
      --bg: #f4f6fa;
      --surface: #ffffff;
      --surface-2: #eef1f6;
      --border: #d9dfe8;

      --text: #1a2230;
      --muted: #5b6675;

      --accent: #c99700;
      --accent-2: #2563eb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);

      font-family:
        system-ui,
        -apple-system,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;

      line-height: 1.45;
    }

    .wrap {
      max-width: var(--wrap);
      margin: 0 auto;
      padding: 0 16px 48px;
    }

    /* ========================================================
       HEADER
       ======================================================== */

    .site-header {
      max-width: var(--wrap);
      margin: 0 auto;
      padding: 20px 16px 8px;
      text-align: center;
    }

    .banner {
      width: 100%;
      height: auto;
      display: block;
      border-radius: var(--radius);
    }

    .kicker {
      margin: 18px 0 2px;

      color: var(--accent);

      font-size: 0.8rem;
      font-weight: 700;

      letter-spacing: 0.18em;
    }

    .site-header h1 {
      margin: 0 0 8px;

      font-size: 1.5rem;
      font-weight: 800;
    }

    .times-note {
      margin: 0;

      color: var(--muted);

      font-size: 0.78rem;
      letter-spacing: 0.08em;
    }

    /* ========================================================
       TABS
       ======================================================== */

    .tabs {
      position: sticky;
      top: 0;
      z-index: 5;

      max-width: var(--wrap);
      margin: 8px auto 0;
      padding: 8px 12px;

      display: flex;
      gap: 8px;

      background: var(--bg);
    }

    .tabs button {
      flex: 1;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;

      padding: 10px 8px;

      cursor: pointer;

      border: 1px solid var(--border);
      border-radius: 10px;

      background: var(--surface);
      color: var(--muted);

      font-family: inherit;
      font-size: 0.9rem;
      font-weight: 700;
    }

    .tabs button:hover {
      background: var(--surface-2);
      color: var(--text);
    }

    .tabs button.active {
      color: #0b0e13;
      background: var(--accent);
      border-color: var(--accent);
    }

    .tabs button:focus-visible {
      outline: 2px solid var(--accent-2);
      outline-offset: 2px;
    }

    .tabs svg {
      width: 17px;
      height: 17px;
      stroke-width: 2.2;
    }

    .summary-title svg {
      width: 15px;
      height: 15px;
      vertical-align: -2px;
    }

    /* ========================================================
       TOP CONTROLS (share + theme)
       ======================================================== */

    .top-controls {
      position: fixed;
      top: 12px;
      right: 12px;
      z-index: 10;

      display: flex;
      gap: 8px;
    }

    .control-btn {
      display: grid;
      place-items: center;

      width: 40px;
      height: 40px;

      cursor: pointer;

      color: var(--text);
      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .control-btn:hover {
      background: var(--surface-2);
    }

    .control-btn svg {
      width: 18px;
      height: 18px;
    }

    .icon-sun,
    .icon-moon {
      display: none;
    }

    :root[data-theme="dark"] .icon-sun {
      display: block;
    }

    :root[data-theme="light"] .icon-moon {
      display: block;
    }

    .share {
      position: relative;
    }

    .share-menu {
      position: absolute;
      top: 46px;
      right: 0;

      min-width: 160px;

      display: flex;
      flex-direction: column;
      gap: 2px;

      padding: 6px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 10px;
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.32);
    }

    .share-menu[hidden] {
      display: none;
    }

    .share-menu a,
    .share-menu button {
      padding: 8px 10px;

      cursor: pointer;

      color: var(--text);
      background: transparent;

      border: 0;
      border-radius: 7px;

      font: inherit;
      font-size: 0.9rem;
      text-align: left;
      text-decoration: none;
    }

    .share-menu a:hover,
    .share-menu button:hover {
      background: var(--surface-2);
    }

    .panel {
      display: none;
      margin-top: 20px;
    }

    .panel.active {
      display: block;
    }

    /* ========================================================
       TOP PICKS / RANKED GAMES
       ======================================================== */

    .games {
      list-style: none;

      margin: 0;
      padding: 0;

      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .game {
      display: grid;
      grid-template-columns: 40px 1fr;
      gap: 12px;

      padding: 14px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: var(--radius);
    }

    .game .rank {
      color: var(--accent);

      font-size: 1.4rem;
      font-weight: 800;

      text-align: center;
      line-height: 1.1;
    }

    .game .title {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .game .meta {
      margin: 2px 0 6px;

      color: var(--muted);

      font-size: 0.85rem;
    }

    .net {
      color: var(--accent-2);
      font-weight: 600;
    }

    .game .desc {
      font-size: 0.92rem;
      opacity: 0.92;
    }

    /* ========================================================
       TIMELINE
       ======================================================== */

    .rows {
      list-style: none;

      margin: 0;
      padding: 0;

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .rows li {
      display: grid;
      grid-template-columns: 90px 1fr;
      gap: 12px;

      align-items: baseline;

      padding: 10px 12px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .row-time {
      color: var(--accent-2);

      font-size: 0.85rem;
      font-weight: 700;
    }

    .row-game {
      font-weight: 700;
    }

    .row-meta,
    .row-note {
      color: var(--muted);
      font-size: 0.82rem;
    }

    /* ========================================================
       WATCH PLAN
       ======================================================== */

    .plan-summary {
      margin-bottom: 18px;
      padding: 14px 16px;

      color: var(--text);

      background: var(--surface);

      border: 1px solid var(--border);
      border-left: 3px solid var(--accent);
      border-radius: var(--radius);

      font-size: 0.95rem;
    }

    .plan-summary strong {
      display: block;
      margin-bottom: 4px;

      color: var(--accent);

      font-size: 0.75rem;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .summary-title {
      margin: 24px 0 10px;

      color: var(--muted);

      font-size: 0.8rem;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: 0.12em;
    }

    .top-picks-title {
      letter-spacing: 0.08em;
    }

    .summary {
      list-style: none;

      margin: 0;
      padding: 0;

      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .summary + .games {
      margin-top: 18px;
    }

    .summary li {
      padding: 10px 14px;

      background: var(--surface);

      border: 1px solid var(--border);
      border-left: 3px solid var(--accent-2);
      border-radius: 10px;

      font-size: 0.9rem;

      opacity: 0.95;
    }

    .plan-alts {
      margin-top: 6px;

      color: var(--muted);

      font-size: 0.76rem;
      opacity: 0.85;
    }

    /* ========================================================
       FOOTER
       ======================================================== */

    .site-footer {
      padding: 24px 16px 40px;

      color: var(--muted);

      font-size: 0.85rem;
      text-align: center;
    }

    .site-footer a {
      color: var(--accent-2);

      font-weight: 600;
      text-decoration: none;
    }

    .site-footer a:hover {
      text-decoration: underline;
    }

    .updated {
      margin-top: 8px;

      opacity: 0.75;
      font-size: 0.78rem;
    }

    /* ========================================================
       RESPONSIVE
       ======================================================== */

    @media (min-width: 560px) {
      .site-header h1 {
        font-size: 1.8rem;
      }
    }

    @media (max-width: 480px) {
      .rows li {
        grid-template-columns: 82px 1fr;
        gap: 8px;
      }

      .tabs button {
        padding: 9px 5px;
        font-size: 0.85rem;
      }
    }
  </style>
</head>

<body>

  <div class="top-controls">

    <div class="share">
      <button
        class="control-btn"
        id="share-btn"
        type="button"
        aria-label="Share"
        aria-haspopup="true"
        aria-expanded="false"
      >
        <i data-lucide="share-2"></i>
      </button>

      <div class="share-menu" id="share-menu" hidden>
        <a class="share-x" target="_blank" rel="noopener">X</a>
        <a class="share-fb" target="_blank" rel="noopener">Facebook</a>
        <a class="share-reddit" target="_blank" rel="noopener">Reddit</a>
        <button type="button" class="share-copy">Copy link</button>
      </div>
    </div>

    <button
      class="control-btn"
      id="theme-toggle"
      type="button"
      aria-label="Toggle light or dark theme"
    >
      <i data-lucide="sun" class="icon-sun"></i>
      <i data-lucide="moon" class="icon-moon"></i>
    </button>

  </div>

  <header class="site-header">

    <img
      class="banner"
      src="https://raw.githubusercontent.com/aherrick/AndyTV/refs/heads/main/AndyTV.Watchlist/assets/img/andytvwatchlist_header.png"
      alt="AndyTV Watchlist"
    />

    <p class="kicker">
      BEST SPORTS TODAY
    </p>

    <h1>
      {{DATE}}
    </h1>

    <p class="times-note">
      All times ET
    </p>

  </header>

  <!-- ======================================================
       NAVIGATION
       ====================================================== -->

  <nav class="tabs" aria-label="Watchlist sections">

    <button type="button" class="active" data-tab="top" aria-selected="true">
      <i data-lucide="trophy"></i>
      Top
    </button>

    <button type="button" data-tab="timeline" aria-selected="false">
      <i data-lucide="clock-3"></i>
      Timeline
    </button>

    <button type="button" data-tab="plan" aria-selected="false">
      <i data-lucide="tv"></i>
      Plan
    </button>

  </nav>

  <!-- ======================================================
       CONTENT
       ====================================================== -->

  <main class="wrap">

    <section class="panel active" data-panel="top">
      {{TOP}}
    </section>

    <section class="panel" data-panel="timeline">
      {{TIMELINE}}
    </section>

    <section class="panel" data-panel="plan">
      {{PLAN}}
    </section>

  </main>

  <!-- ======================================================
       FOOTER
       ====================================================== -->

  <footer class="site-footer">

    <p>
      Made with ❤️ by

      <a
        href="https://x.com/andrew_herrick"
        target="_blank"
        rel="noopener"
      >
        @andrew_herrick
      </a>

      ·

      <a
        href="https://x.com/andytvwatchlist"
        target="_blank"
        rel="noopener"
      >
        @andytvwatchlist
      </a>

    </p>

    <p class="updated">
      {{UPDATED}}
    </p>

  </footer>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script>
    lucide.createIcons();

    document.getElementById("theme-toggle").addEventListener("click", function () {
      var next =
        document.documentElement.getAttribute("data-theme") === "light" ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("andytv-theme", next);
    });

    document.querySelectorAll(".tabs button").forEach(function (btn) {
      btn.addEventListener("click", function () {
        document.querySelectorAll(".tabs button").forEach(function (b) {
          var on = b === btn;
          b.classList.toggle("active", on);
          b.setAttribute("aria-selected", on);
        });
        document.querySelectorAll(".panel").forEach(function (p) {
          p.classList.toggle("active", p.dataset.panel === btn.dataset.tab);
        });
      });
    });

    var shareUrl = location.href;
    var shareTitle = document.title;
    var shareBtn = document.getElementById("share-btn");
    var shareMenu = document.getElementById("share-menu");
    var enc = encodeURIComponent;

    shareMenu.querySelector(".share-x").href =
      "https://twitter.com/intent/tweet?url=" + enc(shareUrl) + "&text=" + enc(shareTitle);
    shareMenu.querySelector(".share-fb").href =
      "https://www.facebook.com/sharer/sharer.php?u=" + enc(shareUrl);
    shareMenu.querySelector(".share-reddit").href =
      "https://www.reddit.com/submit?url=" + enc(shareUrl) + "&title=" + enc(shareTitle);

    function closeShare() {
      shareMenu.setAttribute("hidden", "");
      shareBtn.setAttribute("aria-expanded", "false");
    }

    shareBtn.addEventListener("click", function () {
      if (navigator.share) {
        navigator.share({ title: shareTitle, url: shareUrl }).catch(function () {});
        return;
      }
      var open = shareMenu.hasAttribute("hidden");
      shareMenu.toggleAttribute("hidden", !open);
      shareBtn.setAttribute("aria-expanded", String(open));
    });

    shareMenu.querySelector(".share-copy").addEventListener("click", function () {
      var copy = shareMenu.querySelector(".share-copy");
      if (navigator.clipboard) {
        navigator.clipboard.writeText(shareUrl).then(function () {
          copy.textContent = "Copied!";
          setTimeout(function () {
            copy.textContent = "Copy link";
          }, 1500);
        });
      }
      closeShare();
    });

    shareMenu.querySelectorAll("a").forEach(function (a) {
      a.addEventListener("click", closeShare);
    });

    document.addEventListener("click", function (e) {
      if (!e.target.closest(".share")) {
        closeShare();
      }
    });
  </script>

</body>
</html>
