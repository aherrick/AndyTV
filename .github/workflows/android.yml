name: android

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: [self-hosted, ajmacmini]

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Install MAUI Android workload
        run: dotnet workload install maui-android --ignore-failed-sources

      - name: Install Android SDK dependencies
        run: dotnet build AndyTV.Maui/AndyTV.Maui.csproj -t:InstallAndroidDependencies -f net10.0-android -p:AcceptAndroidSDKLicenses=true

      - name: Publish Android APK
        run: dotnet publish AndyTV.Maui/AndyTV.Maui.csproj -c Release -f net10.0-android -p:AndroidPackageFormat=apk -o publishapk

      - name: Create GitHub release and upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Android build ${{ github.run_number }}
          files: publishapk/*-Signed.apk
