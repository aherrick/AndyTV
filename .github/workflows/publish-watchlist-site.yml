name: publish-watchlist-site

on:
  workflow_dispatch: 

# Back-to-back dispatches queue instead of deploying over each other.
concurrency: publish-watchlist-site

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Rendered by the Watchlist function; --fail stops the deploy if it's missing.
      - name: Download index.html
        run: curl --fail --silent --show-error -o AndyTV.Watchlist.Site/index.html https://andytvwatchlist.blob.core.windows.net/andytv-watchlist/index.html

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.WATCHLIST_SITE_AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          skip_app_build: true
          app_location: AndyTV.Watchlist.Site
