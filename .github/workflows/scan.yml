name: scan

on:
  push:

jobs:
  analyze:
    runs-on: [self-hosted, ajwin]
    env:
      # Roslynator targets up to net10.0; force it onto the .NET 11 RC runtime.
      DOTNET_ROLL_FORWARD: LatestMajor
      DOTNET_ROLL_FORWARD_TO_PRERELEASE: 1
      ROSLYNATOR_VERSION: 1.0.1
      ROSLYNATOR_DIR: C:\code\_runners\_tools\roslynator\1.0.1
    steps:
      - uses: actions/checkout@v5

      # Private SDK outside the workspace: survives checkout's clean, leaves system .NET alone
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: C:\code\_runners\_tools\dotnet
        with:
          dotnet-version: 11.0.x
          dotnet-quality: preview

      # 0.11.0's bundled MSBuild can't load the .NET 11 SDK (MissingMethodException); 1.0.1 can.
      - name: Install Roslynator CLI
        shell: powershell
        run: |
          if (-not (Test-Path "$env:ROSLYNATOR_DIR\roslynator.exe")) {
            dotnet tool install roslynator.dotnet.cli --version $env:ROSLYNATOR_VERSION --tool-path $env:ROSLYNATOR_DIR
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      # Analyzers aren't referenced by the projects, so pull the package directly
      - name: Download Roslynator Analyzers
        shell: powershell
        run: |
          $url = "https://www.nuget.org/api/v2/package/Roslynator.Analyzers"
          Invoke-WebRequest $url -OutFile package.zip
          Expand-Archive package.zip -DestinationPath analyzers/Roslynator.Analyzers
          Remove-Item package.zip

      - name: Analyze
        shell: powershell
        run: >
          & "$env:ROSLYNATOR_DIR\roslynator" analyze AndyTV.slnx
          --analyzer-assemblies "analyzers/Roslynator.Analyzers/analyzers"
          --ignore-compiler-diagnostics

      - name: Find unused private code
        continue-on-error: true
        shell: powershell
        run: >
          & "$env:ROSLYNATOR_DIR\roslynator" find-symbol AndyTV.slnx
          --symbol-kind type-or-member
          --unused
          --visibility private
          --without-attribute System.ObsoleteAttribute
