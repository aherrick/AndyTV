name: build

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: [self-hosted, ajwin]

    steps:
      - uses: actions/checkout@v5

      # Private SDK outside the workspace: survives checkout's clean, leaves system .NET alone
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: C:\code\_runners\_tools\dotnet
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: preview

      - name: Install MAUI Workload
        run: dotnet workload restore

      - name: Build project
        run: dotnet build

      - name: Test
        run: dotnet test --project AndyTV.Tests/AndyTV.Tests.csproj --no-build
