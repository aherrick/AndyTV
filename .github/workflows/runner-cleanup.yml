name: runner-cleanup

# Wipes the persistent SDK/tool dirs; the next build reinstalls only what's current.
on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 1 * *" # 1st of the month

jobs:
  windows:
    runs-on: [self-hosted, ajwin]
    steps:
      - shell: powershell
        run: if (Test-Path C:\code\_runners\_tools) { Remove-Item C:\code\_runners\_tools -Recurse -Force }

  mac:
    runs-on: [self-hosted, ajmacmini]
    steps:
      - run: rm -rf "$HOME/runners"
