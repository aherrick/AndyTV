name: publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pack-publish:
    runs-on: [self-hosted, ajwin]
    env:
      VERSION: 2.0.${{ github.run_number }}
      # Keep in sync with the Velopack package in AndyTV.csproj.
      VPK_VERSION: 1.3.39-g8d2844f

    steps:
      - uses: actions/checkout@v5

      # Private SDK outside the workspace: survives checkout's clean, leaves system .NET alone
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: C:\code\_runners\_tools\dotnet
        with:
          dotnet-version: 11.0.x

      - name: Publish (self-contained win-x64)
        shell: powershell
        run: dotnet publish .\AndyTV\AndyTV.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:Version=$env:VERSION -o publish

      - name: Package and release with Velopack
        shell: powershell
        env:
          # vpk targets up to net10.0; roll forward to the .NET 11 runtime.
          DOTNET_ROLL_FORWARD: LatestMajor
        run: |
          $vpk = "vpk@$env:VPK_VERSION"

          # Fetches the previous full package so pack can build a delta against it.
          dnx --yes $vpk -- download github `
            --repoUrl https://github.com/${{ github.repository }} `
            --channel win `
            --token ${{ github.token }}

          dnx --yes $vpk -- pack `
            --packId com.ajh.AndyTV `
            --packVersion $env:VERSION `
            --packDir publish `
            --mainExe AndyTV.exe `
            --packTitle "AndyTV" `
            --icon .\AndyTV\AndyTV.ico `
            --runtime win-x64 `
            --channel win

          # A failed download or pack leaves no delta; don't publish a full-only release.
          if (!(Test-Path ".\Releases\com.ajh.AndyTV-$env:VERSION-delta.nupkg")) { throw "No delta package was created." }

          dnx --yes $vpk -- upload github `
            --outputDir Releases `
            --channel win `
            --repoUrl https://github.com/${{ github.repository }} `
            --publish `
            --tag v$env:VERSION `
            --releaseName "AndyTV $env:VERSION" `
            --token ${{ github.token }}
