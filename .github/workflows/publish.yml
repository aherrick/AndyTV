name: publish

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pack-publish:
    runs-on: [self-hosted, ajwin]
    env:
      VERSION: 2.0.${{ github.run_number }}
      VPK_VERSION: 1.2.161

    steps:
      - uses: actions/checkout@v5

      # Local install so the self-hosted runner's system .NET isn't touched; 9.0 is for vpk
      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}\.dotnet
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Publish (self-contained win-x64)
        shell: powershell
        run: dotnet publish .\AndyTV\AndyTV.csproj -c Release -r win-x64 --self-contained true -p:PublishReadyToRun=true -p:Version=$env:VERSION -o publish

      - name: Package and release with Velopack
        shell: powershell
        run: |
          $vpk = "vpk@$env:VPK_VERSION"

          dnx --yes $vpk -- download github `
            --repoUrl https://github.com/${{ github.repository }} `
            --channel win `
            --token ${{ github.token }}

          dnx --yes $vpk -- pack `
            --packId com.ajh.AndyTV `
            --packVersion $env:VERSION `
            --packDir publish `
            --mainExe AndyTV.exe `
            --packTitle "AndyTV" `
            --icon .\AndyTV\AndyTV.ico `
            --runtime win-x64 `
            --channel win

          dnx --yes $vpk -- upload github `
            --outputDir Releases `
            --channel win `
            --repoUrl https://github.com/${{ github.repository }} `
            --publish `
            --tag v$env:VERSION `
            --releaseName "AndyTV $env:VERSION" `
            --token ${{ github.token }}
