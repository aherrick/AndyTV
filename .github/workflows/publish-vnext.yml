name: publish-vnext

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-pack-publish:
    runs-on: [self-hosted, ajwin]
    env:
      VERSION: 1.0.${{ github.run_number }}

    steps:
      # Clone the repository (checkout automatically cleans the workspace first)
      - uses: actions/checkout@v4

      # Install .NET SDKs locally in workspace to avoid conflicts with system installations
      - name: Setup .NET (local install)
        uses: actions/setup-dotnet@v5
        env:
          DOTNET_INSTALL_DIR: ${{ github.workspace }}\.dotnet
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      # Configure environment to use the locally installed .NET instead of system version
      - name: Add local dotnet to PATH
        shell: powershell
        run: |
          echo "${{ github.workspace }}\.dotnet" >> $env:GITHUB_PATH
          echo "DOTNET_ROOT=${{ github.workspace }}\.dotnet" >> $env:GITHUB_ENV

      # Build self-contained executable with all dependencies bundled (no .NET runtime required)
      - name: Publish (self-contained win-x64)
        shell: powershell
        run: |
          dotnet publish .\AndyTV.vNext\AndyTV.vNext.csproj -c Release -r win-x64 --self-contained true -p:Version=$env:VERSION -o publish

      # Velopack: distinct packId + channel + tag so vNext installs side-by-side with the stable app.
      - name: Install vpk (local tool) + run
        shell: powershell
        run: |
          dotnet new tool-manifest
          dotnet tool install vpk

          dotnet tool run vpk download github `
            --repoUrl https://github.com/${{ github.repository }} `
            --channel vnext `
            --token ${{ github.token }}

          dotnet tool run vpk pack `
            --packId com.ajh.AndyTV.vNext `
            --packVersion $env:VERSION `
            --packDir publish `
            --mainExe AndyTV.vNext.exe `
            --packTitle "AndyTV vNext" `
            --icon .\AndyTV.vNext\AndyTV.ico `
            --channel vnext

          dotnet tool run vpk upload github `
            --outputDir Releases `
            --channel vnext `
            --repoUrl https://github.com/${{ github.repository }} `
            --publish `
            --pre `
            --tag vnext-v$env:VERSION `
            --releaseName "AndyTV vNext $env:VERSION" `
            --token ${{ github.token }}
